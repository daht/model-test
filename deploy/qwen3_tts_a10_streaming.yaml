# Qwen3-TTS deploy: talker -> code2wav via shared-memory chunk streaming.
# Based on vLLM-Omni v0.25.0rc1 qwen3_tts.yaml. This A10 experiment changes
# only codec chunk sizing: a 6-frame first chunk provides a playback buffer,
# while 16-frame steady chunks reduce the Code2Wav output cadence.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 16
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 6
      decode_cudagraph_capture_sizes: [16, 25, 73, 88, 97, 169, 325]

stages:
  - stage_id: 0
    max_num_seqs: 64
    gpu_memory_utilization: 0.3
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 32768
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 64
    gpu_memory_utilization: 0.3
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0

platforms:
  npu:
    stages:
      - stage_id: 0
        enforce_eager: false
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        compilation_config:
          cudagraph_mode: PIECEWISE
